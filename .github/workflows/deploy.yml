name: Deploy to Arconet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: arconet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy al servidor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # La sesion SSH no llega elevada: deploy-ci.ps1 dispara la tarea
      # programada ArconetDeploy (SYSTEM) y sigue C:\arconet\deploy.log.
      - name: Desplegar en el servidor
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              "$SSH_USER@$SERVER_IP" \
              'powershell -NoProfile -ExecutionPolicy Bypass -File C:\arconet\boot\deploy-ci.ps1'

      - name: Limpiar clave
        if: always()
        run: rm -f ~/.ssh/deploy_key
