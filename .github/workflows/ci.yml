name: Build

# El deploy NO se hace desde GitHub: este servidor esta en ZeroTier (sin IP
# publica), asi que un runner de GitHub no puede alcanzarlo.
# El despliegue lo hace la tarea ArconetDeployPoll en el propio servidor,
# que revisa origin/main cada 5 minutos.
# Este workflow solo compila para avisar temprano si el codigo no construye.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: npm ci + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        # --ignore-scripts: en npm >= 11.6 los scripts de instalacion se
        # bloquean por defecto y "npm ci" falla al ejecutar el preinstall de
        # prisma (y el postinstall de @prisma/engines). No los necesitamos
        # aqui: el paso "Compilar" corre el wrapper de Prisma, que usa el motor WASM
        # (script build de package.json) y las binarias nativas de esbuild
        # se instalan como dependencias opcionales, sin scripts.
        run: npm ci --ignore-scripts

      - name: Lint (bloquea solo errores)
        run: npx eslint . --quiet

      - name: Validar esquema Prisma
        env:
          # prisma.config.ts resuelve env("DATABASE_URL") al cargar; sin este
          # valor el comando falla con "Cannot resolve environment variable".
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
        # scripts/prisma-cli.mjs usa el motor WASM que trae el propio paquete:
        # ni `validate` ni `generate` necesitan descargar binaries.prisma.sh.
        run: node scripts/prisma-cli.mjs validate

      - name: Tests
        run: npm test

      - name: Compilar
        env:
          # Todas las rutas son force-dynamic, el build no consulta la BD;
          # el valor solo evita que falle algo que instancie Prisma.
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
        run: npm run build

      - name: Verificar assets estáticos del build
        # Un chunk ausente o vacío (p. ej. app/admin/page-*.js) provoca
        # ChunkLoadError en el navegador. Se comprueba antes de desplegar.
        run: node ops/verify-static-assets.mjs

      - name: Verificar bundler de producción
        # El runtime de Turbopack puede fallar en el navegador con «module
        # factory is not available». El build oficial es Webpack; si alguien
        # cambia el script o compila sin --webpack, el despliegue se detiene
        # aquí en lugar de llegar a los usuarios.
        run: |
          test -f .next/BUILD_ID
          test -n "$(ls .next/static/chunks/webpack-*.js 2>/dev/null || true)"
          if [ -n "$(find .next/static -iname '*turbopack*' -print -quit)" ]; then
            echo "El build contiene archivos de Turbopack; se exige 'next build --webpack'." >&2
            exit 1
          fi

  windows-deploy-syntax:
    name: Windows PowerShell deployment syntax
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar scripts con Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('deploy.ps1', 'ops/start-arconet.ps1', 'ops/watchdog.ps1', 'ops/poller.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              throw "Invalid PowerShell: $file"
            }
            Write-Host "Syntax OK: $file"
          }
